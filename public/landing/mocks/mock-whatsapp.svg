<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-label="Chat bubble card: an Insider Request was accepted">
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="340" height="200" rx="16" fill="#FFFFFF" filter="url(#s)"/>
  <text x="32" y="46" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6B7280" font-weight="600">Chat</text>
  <rect x="32" y="66" width="220" height="56" rx="16" fill="#F3F4F6"/>
  <text x="46" y="90" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#111827">Your Insider Request was accepted.</text>
  <text x="46" y="110" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#6B7280">Vouch is in progress</text>
  <rect x="108" y="138" width="220" height="40" rx="16" fill="#4F46E5"/>
  <text x="122" y="163" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#FFFFFF">Thanks, I will follow up.</text>
</svg>
